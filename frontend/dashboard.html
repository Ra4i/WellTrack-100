<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard - 100Day Wellness</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>WellTrack 100</h1>

        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="progress.html">Progress</a>
            <a href="index.html">Logout</a>
        </nav>
    </header>

    <section style="padding:50px;color:white;max-width:1100px;margin:auto;">

        <h2 style="margin-bottom:10px;">Welcome back 👋</h2>
        <p style="opacity:0.9;margin-bottom:40px;">Keep building your healthy habits.</p>

        <div class="dashboard">

            <div class="dashboard-card">
                <h3>Current Day</h3>
                <p style="font-size:22px;font-weight:bold;">Day 12 / 100</p>
            </div>

            <div class="dashboard-card">
                <h3>Water Intake</h3>
                <p>6 / 8 glasses</p>
            </div>

            <div class="dashboard-card">
                <h3>Workout</h3>
                <p>Completed</p>
            </div>

            <div class="dashboard-card">
                <h3>Sleep</h3>
                <p>7 hours</p>
            </div>

        </div>

        <div style="margin-top:40px;text-align:center;">
            <a class="btn" href="progress.html">View Full Progress</a>
        </div>

    </section>

</body>

</html>
