<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login · WellTrack 100</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-mark">W</div>
        <span>WellTrack <em>100</em></span>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Continue your 100-day wellness journey.</p>

      <div id="alert" class="alert"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account?
        <a href="register.html">Start your challenge →</a>
      </div>
      <div class="auth-footer" style="margin-top:0.5rem">
        <a href="index.html" style="color:var(--text-muted);font-size:0.82rem">← Back to home</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/app.js"></script>
</body>
</html>
