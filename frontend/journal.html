<!DOCTYPE html>
<html lang="bg">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Журнал · WellTrack 100</title>
  <script>
    try { var s = JSON.parse(localStorage.getItem('wt_user_settings') || '{}'); if (s.theme === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) { }
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar.css" />
  <script src="js/i18n.js"></script>
</head>

<body>

  <div class="app-layout">

    <!-- ── Sidebar ── -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-mark">W</div>
        <div class="logo-text">WellTrack <small>100-дневно предизвикателство</small></div>
      </div>
      <span class="nav-section-label">Основно</span>
      <a class="nav-item" href="dashboard.html"><span class="nav-icon">⚡</span> <span
          data-i18n="nav.dashboard">Табло</span></a>
      <a class="nav-item" href="levels.html"><span class="nav-icon">🏆</span> <span
          data-i18n="nav.levels">Нива</span></a>
      <a class="nav-item" href="progress.html"><span class="nav-icon">📈</span> <span
          data-i18n="nav.progress">Прогрес</span></a>
      <a class="nav-item active" href="journal.html"><span class="nav-icon">📓</span> <span
          data-i18n="nav.journal">Журнал</span></a>
      <a class="nav-item" href="friends.html"><span class="nav-icon">👥</span> <span
          data-i18n="nav.friends">Приятели</span></a>
      <a class="nav-item" href="messages.html"><span class="nav-icon">💬</span> <span
          data-i18n="nav.messages">Съобщения</span></a>
      <a class="nav-item" href="settings.html"><span class="nav-icon">⚙️</span> <span
          data-i18n="nav.settings">Настройки</span></a>
      <div class="sidebar-bottom">
        <div class="user-chip">
          <div class="user-avatar user-avatar-init">A</div>
          <span class="user-name user-display-name">Зареждане...</span>
          <button class="logout-btn" title="Изход" onclick="logout()">⏏</button>
        </div>
      </div>
    </aside>

    <!-- ── Main ── -->
    <main class="main-content">
      <div class="page-header">
        <h1 data-i18n="journal.title">Журнал — Пътят към Свободата</h1>
        <p class="breadcrumb">WellTrack 100 · <span class="user-display-name"></span></p>
      </div>

      <!-- Streak cards -->
      <div class="streak-container">
        <div class="streak-card smoke">
          <span style="color:var(--smoke)" data-i18n="journal.cigarettes">🚭 Цигари</span>
          <span id="smokeDays" class="streak-days">0</span>
        </div>
        <div class="streak-card alcohol">
          <span style="color:var(--alcohol)" data-i18n="journal.alcohol">🍷 Алкохол</span>
          <span id="alcoholDays" class="streak-days">0</span>
        </div>
      </div>

      <!-- Journal form -->
      <div class="journal-form">
        <h3 data-i18n="journal.dailyReport">Дневен отчет</h3>
        <div>
          <label>
            <input type="checkbox" id="checkSmoke" />
            <span data-i18n="journal.smokeCheck">Справих се с цигарите</span>
          </label>
          <label>
            <input type="checkbox" id="checkAlcohol" />
            <span data-i18n="journal.alcoholCheck">Справих се с алкохола</span>
          </label>
        </div>
        <textarea id="noteInput" rows="3" data-i18n-placeholder="journal.notePlaceholder"
          placeholder="Как се чувстваш днес? Имаше ли изкушения?"></textarea>
        <button class="save-btn" onclick="saveEntry()" data-i18n="journal.saveEntry">Запази в историята</button>
      </div>

      <!-- History -->
      <div id="history"></div>
    </main>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script src="js/app.js"></script>
<script src="js/navbar.js"></script>
<script>
  if (typeof requireAuth === 'function') requireAuth();

  const API_URL = 'https://localhost:5001/api/journal';

  document.addEventListener('DOMContentLoaded', () => {
    updateCounters();
    loadHistory();
    applyTranslations();
  });

  function updateCounters() {
    fetch(API_URL)
      .then(r => r.json())
      .then(entries => {
        if (!entries.length) return;
        const latest = entries[0];
        document.getElementById('smokeDays').innerText   = latest.smokeDays;
        document.getElementById('alcoholDays').innerText = latest.alcoholDays;
      });
  }

  async function saveEntry() {
    const note = document.getElementById('noteInput').value;
    const lang = (typeof getCurrentLanguage === 'function') ? getCurrentLanguage() : 'bg';

    if (!note.trim()) {
      alert(lang === 'en' ? 'Write something in the journal!' : 'Напиши нещо в дневника!');
      return;
    }

    const entry = {
      smokeDays:   parseInt(document.getElementById('smokeDays').innerText)   || 0,
      alcoholDays: parseInt(document.getElementById('alcoholDays').innerText) || 0,
      note:        note,
      date:        new Date().toLocaleString(lang === 'en' ? 'en-US' : 'bg-BG')
    };

    await fetch(API_URL, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(entry)
    });

    document.getElementById('noteInput').value      = '';
    document.getElementById('checkSmoke').checked   = false;
    document.getElementById('checkAlcohol').checked = false;

    if (typeof showToast === 'function') {
      showToast(lang === 'en' ? 'Entry saved! 📓' : 'Записът е запазен! 📓');
    }

    loadHistory();
  }

  function loadHistory() {
    const lang       = (typeof getCurrentLanguage === 'function') ? getCurrentLanguage() : 'bg';
    const historyDiv = document.getElementById('history');

    fetch(API_URL)
      .then(r => r.json())
      .then(entries => {
        historyDiv.innerHTML = entries.map(e => `
          <div class="entry">
            <div class="entry-date">${e.date}</div>
            <div style="margin-top:8px;">${e.note}</div>
          </div>
        `).join('');
      });
  }
</script>
</body>

</html>
