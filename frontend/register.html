<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · WellTrack 100</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/i18n.js"></script>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-mark">W</div>
        <span>WellTrack <em>100</em></span>
      </div>

      <h1 data-i18n="home.startChallenge">Start your challenge</h1>
      <p class="subtitle" data-i18n="home.dayOneBeginsNow">Day 1 begins the moment you sign up.</p>

      <div id="alert" class="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name" data-i18n="auth.name">Full Name</label>
          <input type="text" id="name" placeholder="Alex Johnson" required data-i18n="auth.name" />
        </div>
        <div class="form-group">
          <label for="email" data-i18n="auth.email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required data-i18n="auth.email" />
        </div>
        <div class="form-group">
          <label for="password" data-i18n="auth.password">Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters" required data-i18n="auth.password" />
        </div>
        <div class="form-group">
          <label for="confirm" data-i18n="auth.confirmPassword">Confirm Password</label>
          <input type="password" id="confirm" placeholder="••••••••" required data-i18n="auth.confirmPassword" />
        </div>
        <button type="submit" class="btn-primary">Begin 100-Day Challenge 🚀</button>
      </form>

      <div class="auth-footer">
        <span data-i18n="home.alreadyHaveAccount">Already have an account?</span>
        <a href="login.html" data-i18n="auth.login">Sign in</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/app.js"></script>
  <script>
    applyTranslations();
  </script>
</body>
</html>
