<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register · WellTrack 100</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="logo-mark">W</div>
        <span>WellTrack <em>100</em></span>
      </div>

      <h1>Start your challenge</h1>
      <p class="subtitle">Day 1 begins the moment you sign up.</p>

      <div id="alert" class="alert"></div>

      <form id="register-form">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Alex Johnson" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Min. 6 characters" required />
        </div>
        <div class="form-group">
          <label for="confirm">Confirm Password</label>
          <input type="password" id="confirm" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn-primary">Begin 100-Day Challenge 🚀</button>
      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="login.html">Sign in</a>
      </div>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>
  <script src="js/app.js"></script>
</body>
</html>
